{% extends 'base.html' %}

{% block title %}Update Profile - Auth Ensight Plus{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto py-10">
    <div class="bg-white rounded-xl shadow-md overflow-hidden p-8">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Update Profile</h2>
        
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                    <p class="mt-1 text-sm text-error-500">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}
            
            <div class="flex justify-end space-x-4">
                <a href="{% url 'accounts:profile' %}" class="bg-gray-200 text-gray-800 py-2 px-4 rounded-md hover:bg-gray-300 transition-all duration-300">
                    Cancel
                </a>
                <button type="submit" class="bg-primary-500 text-white py-2 px-4 rounded-md hover:bg-primary-600 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-all duration-300">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
