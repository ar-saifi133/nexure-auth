
{% extends "base.html" %}
{% block title %}Logged Out{% endblock %}

{% block content %}
  <h1>You’ve successfully logged out</h1>
  <p>Select where you’d like to log back in:</p>
  <ul>
    {% for app in clients %}
      <li><a href="{{ app.login_url }}">{{ app.name }}</a></li>
    {% endfor %}
  </ul>
{% endblock %}
