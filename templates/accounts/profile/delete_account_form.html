<form id="deleteForm" method="post" novalidate action="{% url 'accounts:delete_account' %}">
    {% csrf_token %}
    <div class="bg-error-50 border-l-4 border-error-400 p-4 mb-6">
        <div class="flex">
            <div class="flex-shrink-0">
                <svg class="h-5 w-5 text-error-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                </svg>
            </div>
            <div class="ml-3">
                <p class="text-sm text-error-700">
                    Warning: This action cannot be undone. All your data will be permanently deleted.
                </p>
            </div>
        </div>
    </div>
    <div>
        <label class="flex items-center">
            {{ form.confirm }}
            <span class="ml-2">{{ form.confirm.label }}</span>
        </label>
        {% if form.confirm.errors %}
            <p class="mt-1 text-sm text-error-500">{{ form.confirm.errors.0 }}</p>
        {% endif %}
    </div>
    <div>
        <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
            {{ form.password.label }}
        </label>
        {{ form.password }}
        {% if form.password.errors %}
            <p class="mt-1 text-sm text-error-500">{{ form.password.errors.0 }}</p>
        {% endif %}
    </div>
    <div class="flex justify-end space-x-4">
        <button type="button" onclick="closeModal()" class="bg-gray-200 text-gray-800 py-2 px-4 rounded-md hover:bg-gray-300 transition-all duration-300">
            Cancel
        </button>
        <button type="submit" class="bg-error-500 text-white py-2 px-4 rounded-md hover:bg-error-600 focus:outline-none focus:ring-2 focus:ring-error-500 focus:ring-offset-2 transition-all duration-300">
            Delete Account
        </button>
    </div>
</form>
