{% extends 'accounts/profile/profile_base.html' %}
{% load static %}


{% block title %}Your Profile - Auth Ensight Plus{% endblock %}

{% block content1 %}
<div class="max-w-full h-full">
    <div class="bg-white  shadow-soft rounded-[12px] overflow-hidden">
        <div class="md:flex w-full">
            
            <div class=" py-10  px-[60px] w-full">
                <h2 class="text-[16px] font-semibold mb-7">Personal Details</h2>
                
                <div class="space-y-7 w-full max-w-[700px]">
                   
                        <div class="w-full flex flex-col space-y-4 gap-4">
                            <div class="flex items-center h-10 justify-between max-w-[700px] w-full " >
                                <p class="text-[14px] font-medium overflow-hidden  ">Full Name</p>
                                <p class="font-medium text-[14px] overflow-hidden border border-accent-grey/30 rounded-[10px] w-[400px] px-[20px] h-10 flex items-center">{{ user.full_name }}</p>
                            </div>

                            <div class='flex items-center h-10 justify-between max-w-[700px] w-full'>
                                <p class="text-[14px] font-medium">Username</p>
                                <p class="font-medium text-[14px] border overflow-hidden border-accent-grey/30 rounded-[10px] w-[400px] px-[20px] h-10 flex items-center">{{ user.username }}</p>
                            </div>

                            <div class='flex items-center h-10 justify-between max-w-[700px] w-full'>
                                <p class="text-[14px] font-medium">Email Address</p>
                                <p class="font-medium text-[14px] border overflow-hidden border-accent-grey/30 rounded-[10px] w-[400px] px-[20px] h-10 flex items-center">{{ user.email }}</p>
                            </div>
                        </div>
                   
                    
                    
                    
                    
                    <div class="flex justify-end space-x-4 ">
                        
                        <button onclick="openDeleteModal()" class=" font-semibold text-[12px] w-[150px] justify-center border h-9  border-error-red flex items-center bg-primary-white text-error-red  px-4 rounded-[10px] focus:outline-none focus:ring-0   transition-all duration-300">
                            Delete Account
                        </button>
                        <div class="font-semibold text-[12px] border h-9  border-accent-grey/30 hover:bg-accent-grey/10 w-[150px] justify-center bg-primary-white text-error-red  px-4 rounded-[10px] focus:outline-none focus:ring-0  transition-all duration-300 flex items-center">  
                            <a href="{% url 'accounts:logout' %}" class="flex text-primary-black items-center">
                                Logout
                            </a>
                        
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="deleteModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center hidden ">
  <div class="bg-white rounded-[16px]  px-[36px] py-[40px] max-w-[680px] w-full" id="modalContent">
    <!-- Form will be loaded here -->
  </div>
</div>
<script>
function attachSubmitHandler() {
    const form = document.getElementById('deleteForm');
    if (form) {
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => {
                console.log('POST response status:', response.status, 'Redirected:', response.redirected);
                if (response.redirected) {
                    console.log('Following redirect to:', response.url);
                    window.location.href = response.url; // Follow redirect on success
                } else if (!response.ok) {
                    throw new Error('Form submission failed: ' + response.status);
                } else {
                    return response.text(); // Get form with errors
                }
            })
            .then(html => {
                if (html) {
                    console.log('Updating modal with error form');
                    document.getElementById('modalContent').innerHTML = html;
                    attachSubmitHandler(); // Reattach after update
                }
            })
            .catch(error => console.error('Error:', error));
        });
    }
}

function openDeleteModal() {
    console.log('Opening modal, fetching form...');
    fetch('{% url "accounts:delete_account" %}', {
        method: 'GET',
        headers: {
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(response => {
        console.log('GET response status:', response.status);
        if (!response.ok) throw new Error('Failed to load form: ' + response.status);
        return response.text();
    })
    .then(html => {
        document.getElementById('modalContent').innerHTML = html;
        document.getElementById('deleteModal').classList.remove('hidden');
        attachSubmitHandler(); // Attach initially
    })
    .catch(error => console.error('Error loading form:', error));
}

function closeModal() {
    console.log('Closing modal');
    document.getElementById('deleteModal').classList.add('hidden');
}
</script>
{% endblock %}
