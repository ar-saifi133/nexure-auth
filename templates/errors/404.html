<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 - Page Not Found</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #021526, #0f4575);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      font-size: 8rem;
      margin: 0;
    }
    p {
      font-size: 1.8rem;
      margin-top: 0.5rem;
    }
    a {
      margin-top: 2rem;
      padding: 0.7rem 1.5rem;
      background: #fff;
      color: #0f4575;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      background: #ddd;
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>The page you’re looking for doesn’t exist.</p>
  <a href="/">Go Home</a>
</body>
</html>
