{% load static %}


<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{% static 'css/terms.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Auth Nexura{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    boxShadow: {
                        'soft': '1px 1px 10px 0px rgba(0, 0, 0, 0.08)',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { maxHeight: '0', paddingTop: '0', paddingBottom: '0' },
                            '100%': { maxHeight: '200px', paddingTop: '1rem', paddingBottom: '1rem' }
                        }
                    },
                    animation: {
                        'slide-up': 'slideUp 4s ease-out forwards',
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            black: 'rgb(0 0 0 / <alpha-value>)',
                            white: 'rgb(255 255 255 / <alpha-value>)',
                            red: '#F44336',
                            grey: 'rgb(63 63 63 / <alpha-value>)'
                        },
                        secondary: {
                            black: '#000000',
                            white: '#F8F8F8',
                            blue: '#03AFDD',
                            grey: '#F3F4F6',
                        },
                        accent: {
                            blue: '#33CCFF', // accent blue
                            grey: 'rgb(140 140 140 / <alpha-value>)', // accent grey
                        },
                        success: {
                            blue: 'rgb( 51 204 255 / <alpha-value>)', // success
                        },
                        warning: {
                            // 500: '#F59E0B', // warning amber
                        },
                        error: {
                            red: ' rgb( 244 67 54 / <alpha-value>) ',
                            500: '#F44336', // error red
                            // error red
                        },
                    },
                },
            },
        }
    </script>
    <style>
        /* Base styles */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
        }

        /* Form animations */
        .form-control {
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .form-control:focus {
            border-color: #4F46E5;
            box-shadow: 0 0 0 0.2rem rgba(79, 70, 229, 0.25);
        }

        /* Button animations */
        .btn-primary {
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Alert animations */
        .alert {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-primary-white text-primary-black h-screen font-sans">


    <main class="container w-full max-w-full min-h-[calc(100vh+60px)]">
        {% comment %} {% if messages %}
        <div class="max-[900px]:w-[368px] max-[450px]:w-[288px] mb-6 msg">
            {% for message in messages %}
            <div class=" max-[900px]:text-[11px] px-6 py-3 rounded-[10px] mb-5 flex items-center justify-between text-[14px] font-medium text-primary-black
                    {% if message.tags == 'success' %}
                   bg-success-blue/20 text-primary-black border border-success-blue/40
                    {% elif message.tags == 'warning' %}
                   {% elif message.tags == 'error' %}
                   bg-error-red/20 border border-error-red/40  text-primary-black
                    {% else %}
                   bg-primary-white text-primary-800
                   {% endif %}
                   ">
                <span class='flex justify-center w-[calc(100%-25px)] '>{{ message }} sdasdasdasdasdasdasdasdasdasd
                </span> <span class="cursor-pointer" onclick="this.closest('.msg').remove()"> <img
                        src='{% static "img/close-icon.svg" %}' /></span>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endcomment %}
        {% block content %}{% endblock %}
    </main>



    {% block extra_js %}{% endblock %}
</body>

</html>
