<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Auth Ensight Plus{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    keyframes: {
                        slideUp: {
                        '0%': { maxHeight: '0', paddingTop: '0', paddingBottom: '0' },
                        '100%': { maxHeight: '200px', paddingTop: '1rem', paddingBottom: '1rem' }
                        }
                    },
                    animation: {
                        'slide-up': 'slideUp 4s ease-out forwards',
                    },
                     fontFamily: {
                            sans: ['Montserrat', 'sans-serif'],
                            },
                    colors: {
                        primary: {
                            black: 'rgb(0 0 0 / <alpha-value>)',
                            white: '#ffffff',
                            red: '#F44336',
                            
                        },
                        secondary: {
                            black: '#000000',
                            white: '#FFFFFF',
                            blue: '#03AFDD',
                            grey: '#F3F4F6',
                        }, 
                        accent: {
                            blue: '#33CCFF', // accent blue
                            grey: '#8C8C8C', // accent grey
                        },
                        success: {
                            200: ' #33CCFF33', // success green
                            400: '#33CCFF66;',
                        },
                        warning: {
                           // 500: '#F59E0B', // warning amber
                        },
                        error: {
                            500: ' #F44336;',
                             // error red
                        },
                    },
                },
            },
        }
    </script>
    <style>
        /* Base styles */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
        }
        
        /* Form animations */
        .form-control {
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        
        .form-control:focus {
            border-color: #4F46E5;
            box-shadow: 0 0 0 0.2rem rgba(79, 70, 229, 0.25);
        }
        
        /* Button animations */
        .btn-primary {
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        /* Alert animations */
        .alert {
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen font-sans">
    
    
    <main class="container w-full max-w-full min-h-[calc(100vh+60px)]">
        {% if messages %}
            <div class="mb-6">
                {% for message in messages %}
                    <div class="alert px-4 py-3 rounded mb-4 {% if message.tags == 'success' %}bg-success-500 text-white{% elif message.tags == 'error' %}bg-error-500 text-white{% else %}bg-primary-100 text-primary-800{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        
        {% block content %}{% endblock %}
    </main>
 

    {% block extra_js %}{% endblock %}
</body>
</html>
